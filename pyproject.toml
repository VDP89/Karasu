[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karasu"
version = "0.1.0"
description = "Adaptive coordination layer between AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DG Ingeniería SRL", email = "info@dgingenieriasrl.com"}
]

dependencies = [
    "watchdog>=4.0",
    # F9 — ``[job-queue]`` extra brings APScheduler. Required for
    # ``application.job_queue.run_repeating`` in
    # ``TelegramInterface.run_application`` (chunk 2). Without it the
    # base install crashes ``karasu chat`` at startup with
    # ``AttributeError: 'NoneType' object has no attribute 'run_repeating'``.
    # Surfaced live during the Phase 3 dogfood (issue #39).
    "python-telegram-bot[job-queue]>=21.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
karasu = "karasu.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
