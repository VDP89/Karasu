[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karasu"
version = "0.1.0"
description = "Adaptive coordination layer between AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DG Ingeniería SRL", email = "info@dgingenieriasrl.com"}
]

dependencies = [
    "watchdog>=4.0",
    # F9 — ``[job-queue]`` extra brings APScheduler. Required for
    # ``application.job_queue.run_repeating`` in
    # ``TelegramInterface.run_application`` (chunk 2). Without it the
    # base install crashes ``karasu chat`` at startup with
    # ``AttributeError: 'NoneType' object has no attribute 'run_repeating'``.
    # Surfaced live during the Phase 3 dogfood (issue #39).
    "python-telegram-bot[job-queue]>=21.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # UI-12c §11.6.13 named scoped exception to UI-0 §4.
    # The dependency exception applies ONLY to:
    #   src/karasu/push_emit/_signing.py     (VAPID JWT signing,
    #                                         RFC 8292 ES256)
    #   src/karasu/push_emit/_keys.py        (VAPID keypair
    #                                         generation +
    #                                         bootstrap)
    #   src/karasu/push_emit/_encryption.py  (RFC 8291
    #                                         aes128gcm payload
    #                                         encryption)
    # Imports anywhere else in the package are a regression and
    # are pinned by tests/test_push_emit_import_scope.py. The
    # exception does NOT generalise; any future chunk asking for
    # additional runtime deps re-opens the UI-0 §4 conversation
    # per chunk.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
karasu = "karasu.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
