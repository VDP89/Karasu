<?xml version="1.0" encoding="UTF-8"?>
<!--
  crow-flight.svg — Karasu UI-6 second canonical asset.

  The wings-extended counterpart to crow.svg (UI-5). Used by the
  Live Map during a flight transition between two domain nodes;
  swapped back to crow.svg once the flight settles.

  Provenance
  ----------
  Single body silhouette path adapted from "Crow dive" by Lorc on
  Game-icons.net, licensed Creative Commons Attribution 3.0 (CC BY 3.0).
  Source: https://game-icons.net/1x1/lorc/crow-dive.html
  License: https://creativecommons.org/licenses/by/3.0/

  Karasu's adaptation strips the original black background rect,
  uplifts fill="currentColor" to the svg root so the silhouette
  recolours through the design tokens (--fg-1 default, --accent /
  --warn during state transitions), and removes Lorc's internal
  white fill so the figure inherits cleanly. No path geometry is
  altered; the dive pose stays the same austere wings-extended
  silhouette the audit asked for. The natural orientation has the
  beak / head pointing UP (the path starts at y=12.61 inside the
  viewBox 512×512 with the body radiating downward); rotation to
  the path tangent is applied at render time via CSS so the asset
  can swap without code changes.

  Why this asset over the other candidates evaluated:
    - Heraldic_Raven.svg (Lokal_Profil)        — perched, wings folded.
    - Corneille_essorant.svg (Jacques63)       — wings spread but
                                                 polygon + gradient
                                                 construction (1000+
                                                 lines), unfit for
                                                 currentColor uplift.
    - White-fronted_tern_volant.svg (Fvasconcellos, CC0)
                                               — wings spread but
                                                 21 paths and tern
                                                 anatomy (marine, not
                                                 corvid).
    - Game-icons "raven" (Lorc, CC BY 3.0)     — single path but
                                                 perched / folded.
    - Game-icons "crow-dive" (Lorc, CC BY 3.0) — single path AND
                                                 wings extended AND
                                                 corvid: chosen.

  See docs/ui/assets/karasu_sprites_spec.md for the full provenance
  table, iteration history and the contract this asset implements.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     fill="currentColor"
     role="img"
     aria-label="Karasu crow in flight">
