<?xml version="1.0" encoding="UTF-8"?>
<!--
    Karasu — canonical crow asset.

    UI-0 §5.6 contract: SVG, monochrome, currentColor, scales
    beyond. Audit-corrected after Codex's UI-5 P0 finding (the
    pixel-grid pass cut against §5.6 even with the right
    anatomy).

    Composition:
      - Two body paths adapted from OpenMoji "Black Bird"
        (1F426 200D 2B1B), CC-BY-SA 4.0. Stroke detail
        omitted; both fills unified under currentColor.
      - Two leg rects added in currentColor — they recolour
        with the four state classes alongside the body.
      - One eye notch as a small circle filled with the
        canvas colour (--bg-0 inline; #0a0a0b in the
        standalone file). Acts as negative space against
        the body fill so the head reads alert.

    Provenance: adapted from OpenMoji
    https://openmoji.org/library/emoji-1F426-200D-2B1B/
    Licensed under CC-BY-SA 4.0. Karasu's leg rects and
    eye dot are operator-added — not part of upstream.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 72 72"
     fill="currentColor"
     role="img"
     aria-label="Karasu">
  <!-- head + upper body -->
  <path d="m40.203,22s3.1218-9,11.4467-4c0,0,8.585.75,8.9753,3.375,0,0-7.9346,1.625-10.0159,5.625s3.1218,7-5.3331,15.625c0,0-4.0324,4.375-10.276,4.375,0,0-22,3-25,0"/>
  <!-- lower body / wing -->
  <path d="m10.125,46.875s24.875-22.875,32.875-21.875,2,13.25-5.5,17.625-27.375,4.25-27.375,4.25Z"/>
  <!-- two legs hanging from the body bottom (moved inward + up
       so both anchors land inside the body fill, not outside it) -->
  <rect x="22" y="45" width="2" height="10"/>
  <rect x="28" y="45" width="2" height="10"/>
  <!-- eye notch — canvas-colour dot inside the head, sized so it
       reads at 24 px header glyph (1.8 r at viewBox 72 → ~0.6 px
       at header scale, ~2.4 px at hero scale) -->
  <circle cx="49" cy="24" r="1.8" fill="#0a0a0b"/>
</svg>
