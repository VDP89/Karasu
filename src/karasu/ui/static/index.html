<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131316">
<link rel="manifest" href="/assets/manifest.json">
<title>Karasu UI</title>
<!-- UI-9 follow-up — ``rel="preload"`` hints let the browser
     fetch every CSS file in parallel with high priority instead
     of serialising them after the HTML parser hits each
     ``<link rel="stylesheet">``. This is a browser hint, NOT a
     build step or a bundler — UI-0 §4 still holds (hand-written
     CSS, no toolchain). Hints come first, the actual stylesheet
     links second so the existing render path is unchanged.
     Lighthouse 2026-05-04 baseline flagged ``render-blocking-
     resources`` as a Performance miss; this is the surgical
     fix. -->
<link rel="preload" href="/assets/css/tokens.css" as="style">
<link rel="preload" href="/assets/css/reset.css" as="style">
<link rel="preload" href="/assets/css/base.css" as="style">
<link rel="preload" href="/assets/css/timeline.css" as="style">
<link rel="preload" href="/assets/css/crow.css" as="style">
<link rel="preload" href="/assets/css/map.css" as="style">
<link rel="preload" href="/assets/css/drawer.css" as="style">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/reset.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/timeline.css">
<link rel="stylesheet" href="/assets/css/crow.css">
<link rel="stylesheet" href="/assets/css/map.css">
<link rel="stylesheet" href="/assets/css/drawer.css">
<style>
/* index.html — application shell rules.
 *
 * Shell-specific CSS lives inline; feature CSS (timeline,
 * future map, future detail panel) lives under
 * static/css/<feature>.css. UI-4 is the first chunk to make
 * that split — see static/css/timeline.css for the event
 * row primitives.
 */

/* The HTML ``hidden`` attribute maps to ``display: none`` in
 * the UA stylesheet, but a class selector with ``display: flex``
 * (the empty-state below) outranks the UA rule by specificity.
 * Restate the contract once at the top so any element toggled
 * via ``el.hidden = true`` actually disappears. */
[hidden] { display: none !important; }

.shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
}

/* --- header ---------------------------------------------------- */

.shell-header {
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-6);
    background: var(--bg-1);
    box-shadow: var(--shadow-1);
}

.brand {
    display: flex;
    align-items: center;
    gap: var(--space-3);
}

.brand-name {
    font-family: var(--font-display);
    font-size: var(--fs-20);
    font-weight: var(--weight-display);
    letter-spacing: var(--tracking-display);
    color: var(--fg-1);
}

/* Sizing only. Color, transition, ambient breathing and the
 * four state classes (idle / processing / waiting / error)
 * live in static/css/crow.css so both crow slots share one
 * source of truth. */
.crow-glyph { width: 24px; height: 24px; }

.bus-path {
    font-family: var(--font-mono);
    font-size: var(--fs-12);
    color: var(--fg-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60vw;
    /* Inline-flex + explicit gap so the label / value split
     * survives CSS minification or HTML whitespace-stripping —
     * mirrors the offline.html .offline-bus pattern. Codex P2
     * polish on the UI-8 audit asked for the explicit gap
     * because the earlier ``margin-right`` on .label relied on
     * text-node collapsing rules. */
    display: inline-flex;
    gap: var(--space-2);
    align-items: baseline;
}

.bus-path .label {
    color: var(--fg-3);
}

/* --- main canvas ----------------------------------------------- */

.shell-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-12) var(--space-6);
}

/* Empty state — single sentence + the crow at rest. The brief's
 * line: "Opens beautifully with zero events on the bus."
 *
 * margin: auto in a flex column centres the only visible child
 * vertically. With the [hidden] safety net at the top of this
 * file, exactly one of .empty-state / .timeline is in the
 * layout at a time, so the auto-margin wins cleanly when the
 * empty state is the visible one and disappears when the
 * timeline takes over (the timeline anchors to the top by
 * default, which is what the operator wants when they come
 * back to read the latest beat). */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-8);
    max-width: 56ch;
    text-align: center;
    margin: auto;
}

/* Sizing only. The 96px hero shares the .crow base class with
 * the 24px header glyph; ambient breathing and state classes
 * live in static/css/crow.css. */
.crow-hero { width: 96px; height: 96px; }

.empty-line {
    margin: 0;
    color: var(--fg-2);
    font-family: var(--font-display);
    font-size: var(--fs-20);
    line-height: var(--lh-display);
    letter-spacing: var(--tracking-display);
}

/* --- footer ---------------------------------------------------- */

.shell-footer {
    position: sticky;
    bottom: 0;
    z-index: var(--z-sticky);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-6);
    background: var(--bg-1);
    box-shadow: var(--shadow-1);
    font-family: var(--font-mono);
    font-size: var(--fs-12);
    color: var(--fg-2);
}

.shell-footer .meta + .meta {
    border-left: 1px solid var(--fg-3);
    padding-left: var(--space-3);
}

/* --- narrow viewport adjustments -------------------------------- */

@media (max-width: 720px) {
    .shell-header,
    .shell-footer {
        padding-left: var(--space-4);
        padding-right: var(--space-4);
    }
    .bus-path { max-width: 40vw; }
    .empty-line { font-size: var(--fs-16); }
}
</style>
</head>
<body>
<div class="shell">

    <header class="shell-header">
        <div class="brand">
            <!-- Canonical crow (UI-5). Pixel-art at 16x16 grain
                 with shape-rendering="crispEdges" so the edges
                 stay jagged at every render scale. Inlined so
                 currentColor + state classes work without an
                 external <use> reference. The .crow base class
                 (static/css/crow.css) binds color, ambient
                 breathing and the four state animations
                 (idle / processing / waiting / error).
                 Source of truth: static/assets/crow/crow.svg —
                 see that file for the per-row pixel layout
                 documentation. -->
            <svg class="crow crow-glyph" id="crow-glyph"
                 viewBox="0 0 72 72"
                 fill="currentColor"
                 role="img" aria-label="Karasu">
                <path d="m40.203,22s3.1218-9,11.4467-4c0,0,8.585.75,8.9753,3.375,0,0-7.9346,1.625-10.0159,5.625s3.1218,7-5.3331,15.625c0,0-4.0324,4.375-10.276,4.375,0,0-22,3-25,0"/>
                <path d="m10.125,46.875s24.875-22.875,32.875-21.875,2,13.25-5.5,17.625-27.375,4.25-27.375,4.25Z"/>
                <rect x="22" y="45" width="2" height="10"/>

                <circle cx="49" cy="24" r="1.8" fill="var(--bg-0)"/>
            </svg>
            <span class="brand-name">Karasu</span>
        </div>
        <div class="bus-path" id="bus-path">
            <span class="label">bus</span><code id="bus-path-value">—</code>
        </div>
    </header>

    <main class="shell-main">
        <div class="empty-state" id="empty-state">
            <!-- Hero crow on the empty state. Same pixel
                 grid as the header glyph; only the display
                 size differs (96 px = 6× the 16-unit grain,
                 perfectly crisp). No id — only the header
                 glyph carries state, the hero stays in the
                 editorial idle. -->
            <svg class="crow crow-hero" viewBox="0 0 72 72"
                 fill="currentColor"
                 aria-hidden="true">
                <path d="m40.203,22s3.1218-9,11.4467-4c0,0,8.585.75,8.9753,3.375,0,0-7.9346,1.625-10.0159,5.625s3.1218,7-5.3331,15.625c0,0-4.0324,4.375-10.276,4.375,0,0-22,3-25,0"/>
                <path d="m10.125,46.875s24.875-22.875,32.875-21.875,2,13.25-5.5,17.625-27.375,4.25-27.375,4.25Z"/>
                <rect x="22" y="45" width="2" height="10"/>
                <rect x="28" y="45" width="2" height="10"/>
                <circle cx="49" cy="24" r="1.8" fill="var(--bg-0)"/>
            </svg>
            <p class="empty-line">
                The bus is silent. Karasu watches the working tree;
                the next change lands here.
            </p>
        </div>
        <div class="shell-main--with-map" id="events-view" hidden>
            <!-- UI-6 Live Map. Five domain nodes positioned in
                 viewBox units (0..800 horizontal, 0..480 vertical):

                   user     ( 80, 240)   left edge
                   karasu   (400, 240)   centre
                   claude   (640, 140)   upper-right
                   codex    (640, 340)   lower-right
                   github   (400,  80)   top centre

                 Coordinates are kept stable in the viewBox space
                 so the JS arc-path layer can compute flight curves
                 by reading the data-x / data-y on each node. The
                 node container itself is editorially still per
                 audit pin #2; only .crow-flight ever transforms.
            -->
            <section class="live-map" aria-label="Karasu Live Map — five domain nodes">
                <svg class="live-map-svg" viewBox="0 0 800 480"
                     preserveAspectRatio="xMidYMid meet"
                     role="img" aria-label="Five domain nodes connected by hairline edges">
                    <!-- Hairline scaffolding. The visible edges
                         are decorative; flight arcs are computed
                         independently by the JS layer below. -->
                    <g class="map-edges">
                        <line class="map-edge" x1="80"  y1="240" x2="400" y2="240"/>
                        <line class="map-edge" x1="400" y1="240" x2="640" y2="140"/>
                        <line class="map-edge" x1="400" y1="240" x2="640" y2="340"/>
                        <line class="map-edge" x1="400" y1="240" x2="400" y2="80"/>
                    </g>
                    <!-- Nodes. Each carries data-node = the
                         identifier _flight_route projects on the
                         wire (user / karasu / claude / codex /
                         github). Hover earns a colour shift only
                         per UI-2's chromatic whitelist. -->
                    <g class="map-node" data-node="user"
                       transform="translate(80,240)" tabindex="0">
                        <circle class="map-node-dot" r="8"/>
                        <text class="map-node-label" y="32">user</text>
                    </g>
                    <g class="map-node" data-node="karasu"
                       transform="translate(400,240)" tabindex="0">
                        <circle class="map-node-dot" r="10"/>
                        <text class="map-node-label" y="34">karasu</text>
                    </g>
                    <g class="map-node" data-node="claude"
                       transform="translate(640,140)" tabindex="0">
                        <circle class="map-node-dot" r="8"/>
                        <text class="map-node-label" y="32">claude</text>
                    </g>
                    <g class="map-node" data-node="codex"
                       transform="translate(640,340)" tabindex="0">
                        <circle class="map-node-dot" r="8"/>
                        <text class="map-node-label" y="32">codex</text>
                    </g>
                    <g class="map-node" data-node="github"
                       transform="translate(400,80)" tabindex="0">
                        <circle class="map-node-dot" r="8"/>
                        <text class="map-node-label" y="-16">github</text>
                    </g>
                </svg>
                <!-- Crow in flight. Single inline copy of
                     crow-flight.svg geometry so currentColor +
                     state classes work without an external <use>
                     reference. Hidden by default; the JS layer
                     un-hides on the first /api/health response
                     that returns a non-null flight projection.
                     Source of truth: static/assets/crow/crow-flight.svg. -->
                <svg class="crow-flight" id="crow-flight" hidden
                     viewBox="0 0 512 512"
                     fill="currentColor"
                     role="img" aria-label="Karasu crow in flight">
                    <path d="M270.713 12.61c6.643 39.436 26.262 70.82 50.46 104.41-26.216-22.16-49.542-51.885-66.99-85.893 1.347 33.463 14.174 58.902 30.5 85.467-18.768-14.65-35.86-33.73-47.558-57.805 5.06 30.615 24.262 60.356 40.176 83.886-14.308-11.715-33.218-31.112-47.34-46.424 16.406 28.247 21.683 48.16 21.634 63.977 7.965 6.568 16.083 13.796 24.334 21.596 16.744 15.827 30.91 36.685 43.49 58.51-7.446-10.075-16.69-20.75-27.95-32.012h-.003c-30.543-30.543-77.793-54.475-116.057-70.408-26.277-34.84-39.484-73.923-52.322-119.918l-9.713 39.732L85.12 27.71l2.65 40.614-33.995-11.916 11.48 34.432-40.175-3.09 30.902 27.37-41.498 10.603c41.23 14.726 84.974 23.305 119.118 48.482 15.908 38.907 40.43 88.373 72.02 119.963 9.87 9.867 19.278 18.166 28.237 25.086-20.32-11.927-39.594-25.195-54.88-40.48-8.6-8.6-16.3-16.744-23.142-24.5-15.544-.32-35.038-5.788-62.29-21.616 15.314 14.12 34.712 33.033 46.43 47.342-23.534-15.914-53.277-35.118-83.898-40.178 24.08 11.698 43.16 28.79 57.813 47.557-26.566-16.326-52.006-29.152-85.47-30.5 34.01 17.45 63.736 40.777 85.897 66.995-33.59-24.2-64.975-43.82-104.414-50.465 68.028 50.728 136.373 93.22 188 172.06 69.836 106.64 132.95 16.87 88.62-13.396-51.68-35.28-36.602-84.41-2.993-86.83 5.078 1.163 9.893 1.72 14.438 1.705.137.04.27.073.407.114l-.117-.12c4.32-.036 8.394-.586 12.22-1.604 1.428 9.75 6.59 20.066 15.143 28.62 10.646 10.645 24.022 16.04 35.64 15.52l43.376 17.862-17.824-43.274c.578-11.653-4.816-25.1-15.51-35.793-8.562-8.563-18.892-13.726-28.652-15.148 1.01-3.81 1.552-7.865 1.588-12.166l.12.118c-.04-.136-.074-.27-.114-.406.014-4.542-.54-9.355-1.703-14.43 2.412-33.615 51.544-48.698 86.828 2.985 30.266 44.33 120.04-18.788 13.397-88.622C363.934 148.98 321.44 80.635 270.713 12.61zm139.043 350.73-.006.008.012.01-.006-.018zm.006.017 18.36 67.55-67.58-18.35c19.076 18.56 60.155 34.722 92.632 43.425-9.707-36.232-23.735-74.074-43.412-92.625z"/>
                </svg>
            </section>
            <ol class="timeline" id="timeline"
                aria-label="Bus event timeline, latest first"></ol>
        </div>
    </main>

    <footer class="shell-footer">
        <span class="meta" id="footer-version">v—</span>
        <span class="meta" id="footer-last-event">no events yet</span>
        <span class="meta" id="footer-crow">crow: idle</span>
    </footer>

</div>

<!-- UI-7 — Detail drawer.
     Slides in from the right when the operator clicks a timeline
     row OR a Live Map node. The backdrop sits below the drawer in
     z-order; clicking it closes. The drawer body is a <pre>
     element so JSON.stringify(..., null, 2) renders with native
     indentation. The 5-class highlighter in the script block
     wraps tokens with the json-key / json-string / json-number /
     json-bool / json-null classes from drawer.css. -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="event-drawer" hidden
       role="dialog" aria-modal="false" aria-labelledby="drawer-type">
    <header class="drawer-header">
        <time class="drawer-time" id="drawer-time">—</time>
        <span class="drawer-type" id="drawer-type">event</span>
        <button class="drawer-close" id="drawer-close"
                type="button" aria-label="Close detail panel">×</button>
    </header>
    <pre class="drawer-body" id="drawer-body"></pre>
</aside>
<script>
const REFRESH_MS = 3000;

async function loadMeta() {
    try {
        const r = await fetch('/api/meta');
        if (!r.ok) return;
        const m = await r.json();
        document.getElementById('bus-path-value').textContent = m.bus_path || '—';
        document.getElementById('footer-version').textContent =
            m.version ? 'v' + m.version : 'v—';
        /* UI-8 — persist the bus path so the offline.html page
         * served by the service worker can render the operator's
         * last-known surface instead of a generic "—". Wrapped in
         * try / catch because some browsers throw on localStorage
         * in private mode; the offline page degrades gracefully
         * to the em-dash placeholder if the value is absent. */
        try {
            if (m.bus_path) {
                localStorage.setItem('karasu:bus_path', m.bus_path);
            }
        } catch { /* private mode / storage disabled — skip */ }
    } catch { /* keep placeholders if /api/meta is unreachable */ }
}

/* UI-8 — service worker registration.
 *
 * Feature-detected (older browsers without SW skip silently;
 * the page still works without the offline fallback). Scope is
 * root because src/karasu/ui/static/sw.js needs to intercept
 * navigation requests for the entire site, not just /assets/*.
 * The Service-Worker-Allowed: / header from the server makes
 * the root scope legal even though the SW file lives under
 * /assets/. */
function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/assets/sw.js', { scope: '/' })
        .catch(() => { /* SW registration is best-effort; the
                          surface works without it */ });
}

/* The timeline reads /api/events as it ships from the server
 * projection. Every visible field in a row maps to one
 * projection key:
 *
 *   row.time       <- e.timestamp
 *   row.type       <- e.type
 *   row.meta       <- composed from e.path / e.agent / e.source
 *
 * The row order is latest-first. The bus is append-only (oldest
 * first on disk), so we reverse a copy here rather than relying
 * on the server. UI-9 may eventually expose a cursor / order
 * parameter; until then this is the canonical surface order. */
function eventMetaLine(e) {
    const parts = [];
    if (e.path)       parts.push(e.path);
    if (e.agent)      parts.push(e.agent);
    if (!parts.length && e.source) parts.push(e.source);
    return parts.join(' · ');
}

function renderTimeline(events) {
    const tl = document.getElementById('timeline');
    /* Replace children rather than incrementally diffing. The
     * default page size (100 events) is small enough that a
     * full re-render every 3 s is invisible to the operator;
     * UI-9 can swap to a key-based diff if dogfood metrics
     * surface a need. */
    tl.replaceChildren();
    const reversed = [...events].reverse();
    for (const e of reversed) {
        const row = document.createElement('li');
        row.className = 'event-row';
        row.tabIndex = 0;
        /* UI-7 — carry the event id on the row so the click
         * handler can resolve which event opened the drawer
         * without re-fetching. The event objects themselves
         * live on the latestEvents module variable so the
         * drawer reads from the same projection the timeline
         * is rendering. */
        if (e.id) row.dataset.eventId = e.id;

        const time = document.createElement('time');
        time.className = 'event-time';
        if (e.timestamp) time.dateTime = e.timestamp;
        time.textContent = e.timestamp || '—';

        const content = document.createElement('div');
        content.className = 'event-content';

        const type = document.createElement('div');
        type.className = 'event-type';
        type.textContent = e.type || 'event';

        const meta = document.createElement('div');
        meta.className = 'event-meta';
        meta.textContent = eventMetaLine(e);

        content.append(type, meta);
        row.append(time, content);
        tl.append(row);
    }
}

/* UI-7 — JSON syntax highlighter (vanilla).
 *
 * Operates on JSON.stringify(event, null, 2). Walks the source
 * with a single regex and wraps each token in one of five span
 * classes (json-key / json-string / json-number / json-bool /
 * json-null) keyed off the existing palette in drawer.css.
 *
 * The 5-class scope is deliberate per Codex pin E for UI-6
 * audit: the surface stays editorial, not dashboard. Adding
 * comment / brace / colon tokens would chrome up a panel that
 * already does its job with five colours.
 *
 * HTML escaping happens before tokenisation so a string value
 * like "&lt;script&gt;" cannot inject markup. The regex below
 * is the standard JSON-on-one-pass pattern from the MDN article
 * (no recursion, single replace), adapted for the 5 token class
 * surface. */
function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => (
        c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'
    ));
}

function highlightJson(json) {
    const escaped = escapeHtml(json);
    return escaped.replace(
        /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d*)?([eE][+\-]?\d+)?)/g,
        function (match) {
            let cls;
            if (/^"/.test(match)) {
                cls = /:$/.test(match) ? 'json-key' : 'json-string';
            } else if (/true|false/.test(match)) {
                cls = 'json-bool';
            } else if (/null/.test(match)) {
                cls = 'json-null';
            } else {
                cls = 'json-number';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        }
    );
}

/* --- UI-7 drawer state ----------------------------------------- */

let latestEvents = [];   /* mirrors the most recent /api/events */

function eventById(id) {
    if (!id) return null;
    for (const e of latestEvents) {
        if (e.id === id) return e;
    }
    return null;
}

function findLatestEventForNode(nodeId) {
    /* Walks events newest-first (events are oldest-first on disk;
     * the timeline already reverses them for display) and returns
     * the first event whose _flight_route pair includes nodeId
     * as source OR target. Mirrors _flight_route's mapping table
     * client-side; the projection is the canonical contract, so
     * this lookup re-implements the same precedence rather than
     * re-fetching /api/health.flight (which only carries the
     * single latest pair).
     *
     * Returns null if no event in the tail involves the node —
     * the drawer opens but renders the empty body state.
     */
    for (let i = latestEvents.length - 1; i >= 0; i--) {
        const e = latestEvents[i];
        const pair = clientFlightRoute(e);
        if (!pair) continue;
        if (pair[0] === nodeId || pair[1] === nodeId) return e;
    }
    return null;
}

function clientFlightRoute(e) {
    /* Mirror of server._flight_route for a single event. Returns
     * [source, target] or null. Kept tiny and dependency-free; the
     * test surface for the canonical projection lives on the
     * server in tests/test_ui_server.py. */
    const t = e.type;
    if (t === 'file_change') {
        if (e.controller_resubmit) return ['user', 'karasu'];
        if (e.github_event || e.source === 'github_webhook') {
            return ['github', 'karasu'];
        }
        if (e.agent && (e.status === 'pending' || e.status === 'dispatched')) {
            const target = agentToNode(e.agent);
            if (target) return ['karasu', target];
        }
        return ['user', 'karasu'];
    }
    if (t === 'agent_response') {
        const src = agentToNode(e.agent);
        return src ? [src, 'karasu'] : null;
    }
    if (t === 'human_decision') return ['user', 'karasu'];
    if (t === 'git_event')      return ['user', 'karasu'];
    return null;
}

function agentToNode(agent) {
    if (agent === 'claude_code' || agent === 'claude') return 'claude';
    if (agent === 'codex') return 'codex';
    return null;
}

function openDrawer(event) {
    /* event = the projected event object, or null when the click
     * target had no event to show (e.g. a node with no traffic
     * yet). The drawer still opens; the body renders the empty
     * sentence instead of JSON. */
    const drawer = document.getElementById('event-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const time = document.getElementById('drawer-time');
    const type = document.getElementById('drawer-type');
    const body = document.getElementById('drawer-body');

    if (event) {
        time.textContent = event.timestamp || '—';
        if (event.timestamp) time.setAttribute('datetime', event.timestamp);
        type.textContent = event.type || 'event';
        body.classList.remove('is-empty');
        body.innerHTML = highlightJson(JSON.stringify(event, null, 2));
    } else {
        time.textContent = '—';
        type.textContent = 'no event';
        body.classList.add('is-empty');
        body.textContent = 'This node has not seen traffic yet.';
    }

    drawer.removeAttribute('hidden');
    backdrop.removeAttribute('hidden');
    /* Force layout flush so the transition fires from the off-
     * canvas position rather than instantaneously. Same pattern
     * as the UI-6 flight transition. */
    void drawer.getBoundingClientRect();
    drawer.classList.add('is-open');
    backdrop.classList.add('is-open');
}

function closeDrawer() {
    const drawer = document.getElementById('event-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    drawer.classList.remove('is-open');
    backdrop.classList.remove('is-open');
    /* Wait for the transition to finish before hiding so the
     * slide-out is visible. Falls back to a fixed timeout since
     * transitionend is fragile across browsers. */
    setTimeout(() => {
        drawer.setAttribute('hidden', '');
        backdrop.setAttribute('hidden', '');
    }, 240);
}

function wireDrawer() {
    /* Event delegation on the timeline (rows are re-rendered
     * every tick) and direct binding on the map nodes (static
     * inline SVG elements that live for the life of the page).
     * Backdrop, X button, Esc key all close. */
    const timeline = document.getElementById('timeline');
    const backdrop = document.getElementById('drawer-backdrop');
    const closeBtn = document.getElementById('drawer-close');

    timeline.addEventListener('click', (ev) => {
        const row = ev.target.closest('.event-row');
        if (!row) return;
        const event = eventById(row.dataset.eventId);
        openDrawer(event);
    });
    timeline.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        const row = ev.target.closest('.event-row');
        if (!row) return;
        ev.preventDefault();
        openDrawer(eventById(row.dataset.eventId));
    });

    for (const node of document.querySelectorAll('.map-node')) {
        node.addEventListener('click', () => {
            const id = node.dataset.node;
            openDrawer(findLatestEventForNode(id));
        });
        node.addEventListener('keydown', (ev) => {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            ev.preventDefault();
            openDrawer(findLatestEventForNode(node.dataset.node));
        });
    }

    backdrop.addEventListener('click', closeDrawer);
    closeBtn.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') closeDrawer();
    });
}

/* UI-6 — Live Map flight rendering.
 *
 * Node coordinates in the SVG viewBox (0..800, 0..480). Mirrors
 * the inline <svg> markup above; declared here so the JS layer
 * does not depend on querying the DOM for transforms (keeps the
 * arc maths independent of any future SVG rewrite).
 *
 * The map can also be queried directly via getBoundingClientRect
 * on each .map-node to project to the container percentage space;
 * the explicit table is faster, deterministic across browsers,
 * and makes the unit tests in test_ui_server.py the authoritative
 * specification of what each node IS. */
const NODE_POSITIONS = {
    user:    { x:  80, y: 240 },
    karasu:  { x: 400, y: 240 },
    claude:  { x: 640, y: 140 },
    codex:   { x: 640, y: 340 },
    github:  { x: 400, y:  80 },
};

const VIEWBOX_W = 800;
const VIEWBOX_H = 480;
const FLIGHT_ARC_LIFT = 70;        /* viewBox units the arc lifts above the chord midpoint */

function nodePct(name) {
    /* Convert a node id to (left%, top%) inside the .live-map
     * container box. The CSS aspect-ratio guarantees the SVG
     * viewBox maps proportionally to the container, so a viewBox
     * point becomes a % of the container without DPI maths. */
    const p = NODE_POSITIONS[name];
    if (!p) return null;
    return { x: (p.x / VIEWBOX_W) * 100, y: (p.y / VIEWBOX_H) * 100 };
}

function flightHeadingDeg(source, target) {
    /* atan2(dy, dx) per Codex pin #4 — beak leads the path
     * tangent. For a single mid-rotate (no per-frame interpolation
     * yet), we sample the chord direction; the arc lift makes the
     * actual tangent shift slightly during the transition, but the
     * magnitude stays restrained per the editorial pin (no barrel
     * rolls). */
    const a = NODE_POSITIONS[source];
    const b = NODE_POSITIONS[target];
    if (!a || !b) return 0;
    const dy = b.y - a.y;
    const dx = b.x - a.x;
    return Math.atan2(dy, dx) * 180 / Math.PI;
}

function reducedMotionActive() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function applyFlight(crowFlight, flight, nodes) {
    /* Drive the crow's position + rotation from the projection.
     *
     * flight=null    → hide crow, clear node accent classes.
     * reduced motion → instant relocate to target (no transition).
     * otherwise      → set --fx/--fy + --flight-heading; CSS
     *                  transition does the 600ms ease-mag arc.
     *
     * The "instant relocate to target" branch is the reduced-motion
     * contract documented in next-session.md: the operator still
     * sees the state change without the flight transition. */
    /* SVG elements descend from SVGElement, not HTMLElement, so
     * the IDL ``hidden`` property is NOT defined on them — setting
     * crowFlight.hidden=false on a <svg> creates a non-reflecting
     * expando instead of removing the attribute, and the
     * [hidden] CSS guard keeps the crow invisible forever. The
     * caught-by-screenshots fix uses removeAttribute /
     * setAttribute('hidden', '') which work on every Element. */
    if (!flight) {
        crowFlight.setAttribute('hidden', '');
        for (const node of nodes) {
            node.classList.remove('map-node--source', 'map-node--target');
        }
        return;
    }
    const sourcePct = nodePct(flight.source);
    const targetPct = nodePct(flight.target);
    if (!sourcePct || !targetPct) {
        crowFlight.setAttribute('hidden', '');
        return;
    }
    crowFlight.removeAttribute('hidden');

    /* Highlight the source / target node dots for the duration of
     * the flight. Only colour shifts (UI-2 chromatic whitelist) —
     * the dots themselves stay the same size, no motion. */
    for (const node of nodes) {
        node.classList.remove('map-node--source', 'map-node--target');
        const id = node.dataset.node;
        if (id === flight.source) node.classList.add('map-node--source');
        if (id === flight.target) node.classList.add('map-node--target');
    }

    if (reducedMotionActive()) {
        /* No transition — snap to target. The asset swap that the
         * brief proposes (perched ↔ flight) is implicit here:
         * crow-flight.svg is the only flight-state asset, and the
         * snap pattern reads as a state change without simulating
         * motion the operator opted out of. */
        crowFlight.style.setProperty('--fx', targetPct.x + '%');
        crowFlight.style.setProperty('--fy', targetPct.y + '%');
        crowFlight.style.setProperty(
            '--flight-heading', flightHeadingDeg(flight.source, flight.target) + 'deg'
        );
        return;
    }

    /* Two-phase relocate so the CSS transition runs from the
     * source → target chord. First place at source instantly,
     * then on the next animation frame set the target position
     * so the transition fires. */
    crowFlight.style.transition = 'none';
    crowFlight.style.setProperty('--fx', sourcePct.x + '%');
    crowFlight.style.setProperty('--fy', sourcePct.y + '%');
    crowFlight.style.setProperty(
        '--flight-heading', flightHeadingDeg(flight.source, flight.target) + 'deg'
    );
    /* Force a layout flush so the source position lands before
     * the transition turns back on. */
    void crowFlight.getBoundingClientRect();
    crowFlight.style.transition = '';
    crowFlight.style.setProperty('--fx', targetPct.x + '%');
    crowFlight.style.setProperty('--fy', targetPct.y + '%');
}

async function tick() {
    let events = [];
    let crow = 'idle';
    let flight = null;
    try {
        const [eventsRes, healthRes] = await Promise.all([
            fetch('/api/events'),
            fetch('/api/health'),
        ]);
        if (eventsRes.ok) {
            events = (await eventsRes.json()).events || [];
            /* UI-7 — keep a module-level mirror so the drawer
             * can resolve event ids to the projected event
             * without re-fetching. The reference is replaced
             * each tick, so closed-over copies inside the
             * drawer stay valid for the lifetime of the open
             * drawer (the operator may keep a drawer open
             * across multiple ticks). */
            latestEvents = events;
        }
        if (healthRes.ok) {
            const health = await healthRes.json();
            crow = health.crow || 'idle';
            /* /api/health.flight is null when the bus is silent
             * or the projection has no mapped pair; otherwise
             * {source, target}. */
            flight = health.flight || null;
        }
    } catch { /* network blip — leave the surface as-is */ }

    const empty = document.getElementById('empty-state');
    const eventsView = document.getElementById('events-view');
    const timeline = document.getElementById('timeline');
    const lastEvent = document.getElementById('footer-last-event');
    const footerCrow = document.getElementById('footer-crow');
    const glyph = document.getElementById('crow-glyph');
    const crowFlight = document.getElementById('crow-flight');
    const mapNodes = Array.from(document.querySelectorAll('.map-node'));

    if (events.length === 0) {
        /* Empty state stays the first impression on a silent bus
         * — pin from UI-3 / UI-5 carried forward to UI-6. The map
         * appears once events populate the projection. */
        empty.hidden = false;
        eventsView.hidden = true;
        timeline.replaceChildren();
        lastEvent.textContent = 'no events yet';
        applyFlight(crowFlight, null, mapNodes);
    } else {
        empty.hidden = true;
        eventsView.hidden = false;
        renderTimeline(events);
        const tail = events[events.length - 1];
        lastEvent.textContent = 'last event ' + (tail.timestamp || '—');
        applyFlight(crowFlight, flight, mapNodes);
    }
    footerCrow.textContent = 'crow: ' + crow;
    glyph.classList.remove('processing', 'waiting', 'error');
    if (crow !== 'idle') glyph.classList.add(crow);
}

loadMeta();
tick();
wireDrawer();
registerServiceWorker();
setInterval(tick, REFRESH_MS);
</script>
